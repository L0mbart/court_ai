name: CourtAI
options:
  bundleIdPrefix: com.courtai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: CourtAI/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.courtai.basketball
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  CourtAI:
    type: application
    platform: iOS
    sources:
      - CourtAI
    settings:
      base:
        INFOPLIST_FILE: CourtAI/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.courtai.basketball
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 5
        MARKETING_VERSION: 1.1.3
        TARGETED_DEVICE_FAMILY: "1"
